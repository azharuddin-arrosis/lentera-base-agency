<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sketsa Bima Saputra">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="shirtB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="400" height="400" rx="200" fill="url(#bgB)"/>
  <circle cx="200" cy="200" r="196" fill="none" stroke="#00000012" stroke-width="8"/>

  <!-- shoulders / shirt (collared) -->
  <path d="M90 400 C96 322 140 292 200 292 C260 292 304 322 310 400 Z" fill="url(#shirtB)"/>
  <path d="M182 298 L200 330 L218 298" fill="#0f172a"/>
  <path d="M176 296 L200 330" stroke="#475569" stroke-width="3" fill="none"/>
  <path d="M224 296 L200 330" stroke="#475569" stroke-width="3" fill="none"/>

  <!-- neck -->
  <path d="M178 260 C178 288 222 288 222 260 L222 236 L178 236 Z" fill="#e0a878"/>
  <path d="M178 260 C178 288 222 288 222 260" fill="#00000010"/>

  <!-- head -->
  <g stroke="#1f2937" stroke-width="3.5" fill="#efbf95" stroke-linecap="round" stroke-linejoin="round">
    <path d="M138 178 C138 120 168 94 200 94 C232 94 262 120 262 178 C262 216 242 244 224 256
             C216 262 184 262 176 256 C158 244 138 216 138 178 Z"/>
    <path d="M138 178 C127 174 125 198 139 202" fill="#efbf95"/>
    <path d="M262 178 C273 174 275 198 261 202" fill="#efbf95"/>
  </g>

  <!-- hair (side part, a bit fuller) -->
  <path d="M132 176 C128 116 164 84 202 84 C240 84 270 116 268 172
           C260 150 250 140 240 136 C246 150 244 160 240 168
           C232 150 214 146 198 148 C176 150 160 160 156 178
           C150 160 142 156 132 176 Z" fill="#241b16"/>
  <path d="M156 178 C168 150 210 146 240 168" fill="none" stroke="#120c09" stroke-width="2.5"/>

  <!-- eyebrows -->
  <path d="M160 178 C170 172 184 172 192 178" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <path d="M208 178 C216 172 230 172 240 178" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>

  <!-- glasses -->
  <g fill="none" stroke="#0f172a" stroke-width="4">
    <rect x="156" y="184" width="42" height="30" rx="10"/>
    <rect x="202" y="184" width="42" height="30" rx="10"/>
    <path d="M198 196 L202 196"/>
    <path d="M156 190 L142 186"/>
    <path d="M244 190 L258 186"/>
  </g>

  <!-- eyes -->
  <circle cx="177" cy="199" r="4.2" fill="#1f2937"/>
  <circle cx="223" cy="199" r="4.2" fill="#1f2937"/>

  <!-- nose -->
  <path d="M200 202 L194 224 C194 230 206 230 206 224" fill="none" stroke="#b47a50" stroke-width="3" stroke-linecap="round"/>

  <!-- mouth (calm smile) -->
  <path d="M180 240 C193 248 207 248 220 240" fill="none" stroke="#7c4436" stroke-width="3.5" stroke-linecap="round"/>

  <!-- short beard along the jaw -->
  <path d="M150 208 C156 250 178 268 200 268 C222 268 244 250 250 208
           C244 236 232 250 224 256 C216 262 184 262 176 256 C168 250 156 236 150 208 Z"
        fill="#241b16" opacity="0.92"/>
  <path d="M180 240 C193 248 207 248 220 240" fill="none" stroke="#efbf95" stroke-width="4" stroke-linecap="round"/>
</svg>
